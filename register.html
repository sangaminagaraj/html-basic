<!DOCTYPE html>
<head>
    <title> Registration</title>
</head>
<body>
    <center>
    <h1>Registration Form</h1>
    
    <form action="">
        <table>
            <tr>
                <td>Name:</td> <td><input type="text" placeholder="Enter Your Name"></td>
            </tr>

            <tr><td>Age:</td>
            <td><input type="number" placeholder="Enter Your Age"></td>
            </tr>
               
             <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="Gender">Male 
                    <input type="radio" name="Gender">Female
                </td>
             </tr>
            <tr>
                <td>City:</td> <td><input type="text" placeholder="Enter Your City"></td>
            </tr>

            <tr><td>Mobile Number:</td> <td><input type="number" placeholder="Enter Your Number"></td></tr>

            <tr><td><input type="submit"></td> <td><input type="reset"></td></tr>
        </table>
    </form>

</center>
</body>

</html>
